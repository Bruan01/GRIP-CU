  <g id="text_42">
   <text style="font-size: 6.8px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="259.370079" y="277.114961" transform="rotate(-0 259.370079 277.114961)">Rescue − regression = net gain: 321 − 162 = 159 (NELL23K); 301 − 70 = 231 (CoDEx-M).</text>
