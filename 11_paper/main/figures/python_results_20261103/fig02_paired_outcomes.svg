   <text style="font-size: 6.8px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: middle" x="259.370079" y="260.900787" transform="rotate(-0 259.370079 260.900787)">Each cell: number of test questions and percentage of that dataset’s full test cohort.</text>
